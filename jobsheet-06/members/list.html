        <main>

            <section>
                <h2>Member List</h2>

                <div class="search-box">
                    <label for="search-input">Search Member Name</label>
                    <input type="text" id="search-input"
                        placeholder="Type a member name...">

                <p id="row-counter">Showing 0 of 0 members</p>

                <div class="table-responsive">
                    <p id="loading-indicator">Loading data...</p>
                    <table>

                        <thead>
                            <tr>
                                <th>Member No.</th>
                                <th>Name</th>
                                <th>Address</th>
                                <th>Phone Number</th>
                                <th>Gender</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody> </tbody>

                    </table>
