<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Add Member</title>
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>

        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../book/list.html">Book List</a></li>
                <li><a href="../book/add.html">Add Book</a></li>
                <li><a href="list.html">Member List</a></li>
                <li><a href="add.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section>
            <h2>Add Member</h2>

            <form>

                <p>
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="name" required >
                </p>

                <p>
                    <label for="member_no">Member No.</label><br>
                    <input type="text" id="member_no" name="member_no" required >
                </p>

                <p>
                    <label for="address">Address</label><br>
                    <input type="text" id="address" name="address" >
                </p>

                <p>
                    <label for="phone">Phone Number</label><br>
                    <input type="text" id="phone" name="phone" >
                </p>

                <p>
                    <label for="gender">Gender</label><br>

                    <select id="gender" name="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email" >
                </p>

                <p>
                    <button type="submit">Save</button>
                </p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>

</body>
</html>
